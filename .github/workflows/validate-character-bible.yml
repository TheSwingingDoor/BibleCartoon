name: Validate character bible

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify asset fingerprints
        run: python scripts/build_asset_manifest.py --check
      - name: Validate bible structure and canon invariants
        run: python scripts/validate_bible.py
